name: Storybook

# Liquorify's Storybook of the storefront's components (LIQ-010 §11 in the
# backend repository): builds it, checks the token file, reports coverage, and
# compares every story with its committed reference image in Playwright's
# pinned container image. Advisory: it is not a required check, and it never
# writes or accepts a reference image.
on:
  pull_request:
    paths:
      - "stories/**"
      - ".storybook/**"
      - "visual/**"
      - "src/**"
      - "messages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storybook:
    name: "Storybook & visual check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Next.js's font loader fetches Geist's stylesheet from Google Fonts here;
      # the font files themselves are served from visual/fonts during the check.
      - run: pnpm build-storybook

      - name: Check the token file
        run: pnpm tokens:check

      - name: Report coverage
        run: node stories/scripts/coverage.mjs --summary "$GITHUB_STEP_SUMMARY"

      - name: Compare screenshots in the pinned Playwright image
        run: pnpm visual

      - name: Upload the comparison report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-report
          path: visual/report
          retention-days: 14
          if-no-files-found: ignore

      # Reference, actual and difference images for each changed story, and a
      # proposed image for each story without a reference. A person reviews
      # them and commits accepted ones in a pull request.
      - name: Upload failure images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-failures
          path: visual/results
          retention-days: 14
          if-no-files-found: ignore
